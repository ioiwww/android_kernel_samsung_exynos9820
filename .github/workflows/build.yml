name: Build d2s Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Include KernelSU-Next (manual hooks)"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      release:
        description: "Create a GitHub Release with the artifacts"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
  push:
    branches:
      - lineage-23.2
    paths:
      - "build.sh"
      - "scripts/ksu-integrate.py"
      - ".github/workflows/build.yml"
      - "arch/arm64/configs/exynos9820-d2s_defconfig"

concurrency:
  group: build-d2s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel for d2s
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      MODEL: d2s
      DEFCONFIG: exynos9820-d2s_defconfig
      KSU: ${{ github.event.inputs.ksu || 'yes' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip cpio kmod ccache rsync python3 \
            curl wget ca-certificates xz-utils file gawk \
            zlib1g-dev libncurses-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            device-tree-compiler

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-d2s-${{ env.KSU }}
          max-size: 2G

      - name: Cache Proton Clang toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: proton-clang-master-v2

      - name: Download Proton Clang
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e
          rm -rf toolchain/clang
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang
          ls toolchain/clang/bin/clang

      - name: Integrate KernelSU-Next (setup.sh)
        if: ${{ env.KSU == 'yes' }}
        run: |
          set -e
          # Official KernelSU-Next setup script — `legacy` branch is the one
          # that supports non-GKI 4.14 kernels with manual hooks.
          # The `dev`/default branch dropped manual hooks and assumes 5.10+.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy

      - name: Apply KernelSU-Next manual hooks + defconfig overrides
        if: ${{ env.KSU == 'yes' }}
        run: |
          set -e
          chmod +x scripts/ksu-integrate.py
          python3 scripts/ksu-integrate.py
          echo "--- defconfig diff (KSU + Samsung security flags) ---"
          grep -E '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_OVERLAY_FS|# CONFIG_(UH|RKP|KDP|KNOX|SECURITY_DEFEX|FIVE|PROCA))' \
            arch/arm64/configs/exynos9820-d2s_defconfig || true

      - name: Build kernel
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Stage release files
        id: stage
        run: |
          set -e
          OUT=out/arch/arm64/boot
          STAGE=release/d2s
          mkdir -p "$STAGE"

          cp -v "$OUT/Image" "$STAGE/Image"
          [ -f "$OUT/Image.gz" ]      && cp -v "$OUT/Image.gz"      "$STAGE/" || true
          [ -f "$OUT/Image.gz-dtb" ]  && cp -v "$OUT/Image.gz-dtb"  "$STAGE/" || true
          [ -f dist/d2s/dtb.img  ]    && cp -v dist/d2s/dtb.img     "$STAGE/dtb.img"  || true
          [ -f dist/d2s/dtbo.img ]    && cp -v dist/d2s/dtbo.img    "$STAGE/dtbo.img" || true
          if ls dist/d2s/AnyKernel3-*.zip >/dev/null 2>&1; then
            cp -v dist/d2s/AnyKernel3-*.zip "$STAGE/"
          fi
          ls -lah "$STAGE"

          STAMP=$(date -u +%Y%m%d-%H%M%S)
          SHA=$(git rev-parse --short HEAD)
          KSU_TAG=""; [ "${{ env.KSU }}" = "yes" ] && KSU_TAG="ksu-"
          echo "stamp=${STAMP}"                                   >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"                                       >> "$GITHUB_OUTPUT"
          echo "artifact_name=d2s-kernel-${KSU_TAG}${STAMP}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: release/d2s/**
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: ${{ github.event.inputs.release == 'yes' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: d2s-${{ steps.stage.outputs.stamp }}
          name: d2s ${{ steps.stage.outputs.stamp }} (${{ steps.stage.outputs.sha }})
          body: |
            Automated build of `android_kernel_samsung_exynos9820` for **d2s** (Galaxy S10+).
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ steps.stage.outputs.sha }}`
            - KernelSU-Next: `${{ env.KSU }}`
            - Toolchain: Proton Clang
          files: release/d2s/**
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
