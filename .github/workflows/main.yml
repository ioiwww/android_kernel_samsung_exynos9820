name: Auto Merge OpenELA LTS

on:
  workflow_dispatch:
    inputs:
      openela_tag:
        description: 'رقم إصدار OpenELA (مثال: v4.14.356-openela)'
        required: true
        default: 'v4.14.356-openela'
      target_branch:
        description: 'اسم الفرع الخاص بك (مثال: main أو lineage-19.1)'
        required: true
        default: 'main'

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ضروري جداً لسحب تاريخ الكيرنل كاملاً للدمج
          ref: ${{ github.event.inputs.target_branch }}
          # نستخدم التوكن الخاص بك هنا لكي يمتلك السكريبت صلاحية الدفع لاحقاً
          token: ${{ secrets.uploade }} 

      - name: Setup Bot Git Config
        run: |
          # ضع اسم البوت وإيميله هنا
          git config --global user.name "Linkit-Bot"
          git config --global user.email "bot@example.com"

      - name: Add Official OpenELA Remote & Fetch
        run: |
          echo "Adding official OpenELA remote..."
          git remote add openela https://github.com/openela/kernel-lts.git
          echo "Fetching tag: ${{ github.event.inputs.openela_tag }}"
          git fetch openela tags/${{ github.event.inputs.openela_tag }}

      - name: Execute Strict Merge
        id: do_merge
        run: |
          # الدمج بدون فتح محرر النصوص.
          # إذا حدث أي تضارب (Conflict)، سيعطي هذا الأمر رمز خطأ (Non-zero exit)
          # مما سيؤدي إلى إيقاف الـ Action فوراً وإفشاله.
          git merge FETCH_HEAD --no-edit

      - name: Verify Merge Success
        run: |
          # تحقق نهائي: إذا كان Git عالقاً في حالة دمج (MERGE_HEAD موجود)، فهذا يعني فشل العملية
          if git rev-parse -q --verify MERGE_HEAD; then
            echo "خطأ: الدمج لم يكتمل بشكل نظيف. هناك ملفات تحتاج لتدخل يدوي!"
            exit 1
          fi
          echo "تم التحقق: الدمج نظيف ومكتمل."

      - name: Push Merged Kernel
        run: |
          echo "Pushing changes to ${{ github.event.inputs.target_branch }}..."
          git push origin ${{ github.event.inputs.target_branch }}
