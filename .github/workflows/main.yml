name: Auto Merge OpenELA LTS (Force Resolve)

on:
  workflow_dispatch:
    inputs:
      openela_tag:
        description: 'رقم إصدار OpenELA'
        required: true
        default: 'v4.14.356-openela'
      target_branch:
        description: 'الفرع المستهدف للدمج'
        required: true
        default: 'lineage-23.2'

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          ref: ${{ github.event.inputs.target_branch }}
          token: ${{ secrets.uploade }} 

      - name: Setup Bot Git Config
        run: |
          git config --global user.name "Linkit-Bot"
          git config --global user.email "bot@example.com"
          # تهيئة التعامل مع التضاربات بشكل آلي
          git config --global merge.verbosity 3

      - name: Add Official OpenELA Remote & Fetch
        run: |
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch openela tags/${{ github.event.inputs.openela_tag }}

      - name: Execute Force Merge
        id: do_merge
        run: |
          echo "Starting merge with strategy: theirs..."
          # استخدام -X theirs يحل تضاربات المحتوى تلقائياً لصالح OpenELA
          git merge FETCH_HEAD --no-edit -X theirs || {
            echo "حدث خطأ غير متوقع لا يمكن حله تلقائياً (مثل تضارب في حذف الملفات)"
            exit 1
          }

      - name: Final Verification
        run: |
          if git rev-parse -q --verify MERGE_HEAD; then
            echo "خطأ: لا تزال هناك ملفات عالقة. محاولة الإصلاح الأخيرة..."
            git add .
            git commit -m "Auto-fix remaining conflicts using theirs strategy"
          fi
          echo "تم الدمج والتحقق بنجاح."

      - name: Push Merged Kernel
        run: |
          # دفع التعديلات إلى المستودع
          git push origin ${{ github.event.inputs.target_branch }}
